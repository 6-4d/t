:root{--bg:#101010;--ink:#eee;--mute:#8a8a8a;--w:min(82vw,44vh,380px);box-sizing:border-box}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:bw,system-ui,sans-serif;text-transform:lowercase;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
html{scrollbar-width:none;color-scheme:dark}
::-webkit-scrollbar{display:none}
#col{position:absolute;inset:0;overflow:hidden}
.sh{position:absolute;width:var(--w);left:calc(50% - var(--w)/2);top:calc(50% - var(--w)/2);transform:translateY(var(--sy,0px));transition:transform .55s cubic-bezier(.2,.9,.3,1)}
.sh.idle{opacity:.01;pointer-events:none}
.drag{position:relative;will-change:transform}
.cards{position:relative;aspect-ratio:1;width:100%}
.cards>*{position:absolute}
.cards img{left:0;top:0;width:100%;height:100%;object-fit:cover;border-radius:8%;background:#1c1c1c;pointer-events:none;-webkit-user-drag:none}
.cards canvas.glow{left:50%;top:50%;width:145%;height:145%;transform:translate(-50%,-50%);opacity:.75;z-index:-1;pointer-events:none}
.pp{left:50%;top:50%;margin:-55px 0 0 -55px;width:110px;height:110px;display:grid;place-items:center;opacity:0;transform:scale(.7);transition:opacity .2s,transform .3s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
.pp.on{opacity:1;transform:none}
.pp.on svg{filter:drop-shadow(0 2px 12px rgba(0,0,0,.5))}
.win{position:absolute;left:0;right:0;top:calc(100% + 22px);isolation:isolate;opacity:0;transform:scale(.92) translateY(-14px);pointer-events:none;transition:opacity .3s,transform .5s cubic-bezier(.3,1.4,.5,1)}
.win.on{opacity:1;transform:none;pointer-events:auto}
.win canvas.wglow{position:absolute;left:50%;top:50%;width:135%;height:190%;transform:translate(-50%,-50%);opacity:.5;z-index:-1;pointer-events:none}
.inner{position:relative;background:#1a1a1a;border-radius:26px;padding:20px 16px;min-height:168px;display:flex;align-items:center;justify-content:center;text-align:center}
.inner>div{display:none;width:100%}
.win.info .vInfo,.win.data .vData{display:block}
h2{font-size:24px;font-weight:400;margin:0 0 2px;line-height:1.2;overflow-wrap:anywhere}
p{margin:0 0 16px;color:var(--mute);font-size:18px;overflow-wrap:anywhere}
.row{display:flex;gap:14px;justify-content:center}
.ic{width:56px;height:56px;border-radius:36%;corner-shape:squircle;overflow:hidden;border:0;padding:0;background:#2a2a2a;display:block;cursor:pointer;transition:transform .15s cubic-bezier(.3,1.5,.5,1),background .25s}
.ic:active{transform:scale(.88)}
.ic img,.ic svg{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.ic:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.lAp{background:#FF2950}
.rst .ck{display:none}.rst.armed .ck{display:block}.rst.armed .rs{display:none}.rst.armed{background:#a33}
.bad{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#msg{position:absolute;left:0;right:0;bottom:8vh;text-align:center;color:var(--mute);font-size:18px;padding:0 24px;pointer-events:none}
.file{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>

  learn(cur,dir,audio.duration?audio.currentTime/audio.duration:0);
  flying=true;cur=null;audio.pause();hap(dir>0?14:9);
  const old=cs;old.state='out';outFly(old,dir,vx,vy);
  const s=await ensure();ns=null;s.state='cur';cs=s;cur=s.t;
  enter(s);show(s.t);flying=false;ensure();refill();sync();
}
/* an open pop-up takes over every swipe and is thrown away in any direction */
function dismiss(s,vx,vy){
  s.mode='';hap(6);s.el.style.transition='';s.el.style.setProperty('--sy','0px');
  cancelAnimationFrame(s.raf.w);s.win.style.transition='none';const w=s.Wn;
  let m=Math.hypot(vx,vy);
  if(m<.3){const d=Math.hypot(w.x,w.y);if(d>1){vx=w.x/d;vy=w.y/d}else{vx=0;vy=1}m=1}
  const ux=vx/m,uy=vy/m;let v=Math.max(m*1000,900),t0=performance.now();
  const step=t=>{const dt=clamp((t-t0)/1000,0,.05);t0=t;v*=1+4*dt;w.x+=ux*v*dt;w.y+=uy*v*dt;
    const dist=Math.hypot(w.x,w.y);renderW(s);s.win.style.opacity=clamp(1.3-dist/(innerHeight*.7),0,1);
    if(dist>innerHeight*.9){if(!s.mode)killWin(s)}else s.raf.w=requestAnimationFrame(step)};
  s.raf.w=requestAnimationFrame(step);
}
/* double tap: spin the cover like a fidget spinner for about 30 seconds */
function spin(s){
  cancelAnimationFrame(s.spinRaf);
  const dir=Math.random()<.5?1:-1,T=(20+Math.random()*20)*1000,w0=(2+Math.random()*2.5)*360,t0=performance.now();
  let a=s.spinA||0,last=t0,lastTick=a,lastHap=0;hap(14);
  const step=t=>{if(s.state==='idle')return;
    const u=(t-t0)/T;if(u>=1)return;
    const dt=Math.min(.05,(t-last)/1000);last=t;a+=dir*w0*(1-u)*(1-u)*dt;s.spinA=a;
    s.cover.style.transform=`rotate(${a}deg)`;
    if(Math.abs(a-lastTick)>=180&&t-lastHap>110){lastTick=a;lastHap=t;hap(4)}
    s.spinRaf=requestAnimationFrame(step)};
  s.spinRaf=requestAnimationFrame(step);
}
function tapCover(s){if(unl){unl=false;return}const n=performance.now(),dbl=n-lastTap<300;lastTap=dbl?0:n;audio.paused?audio.play():audio.pause();if(dbl)spin(s)}
const vertical=dir=>{open(cs,dir<0?'info':'data');hap(6)};
/* gestures: swipe from anywhere */
let FD={x:0,y:0},sx=0,sy=0,ox=0,oy=0,down=false,moved=false,crossed=false,inCard=false,tgt='c',hist=[],gS=null;
const vel=()=>{const n=hist.length;if(n<2)return[0,0];const b=hist[n-1],a=hist.find(h=>b[2]-h[2]<100)||hist[0],dt=Math.max(8,b[2]-a[2]);return[(b[0]-a[0])/dt,(b[1]-a[1])/dt]};
addEventListener('pointerdown',e=>{
  if(!cur||flying||!cs)return;
  gS=cs;tgt=gS.mode?'w':'c';
  const P=tgt==='c'?gS.C:gS.Wn;cancelAnimationFrame(gS.raf[tgt]);if(tgt==='w'){gS.win.style.transition='none';gS.el.style.transition='none'}
  down=true;moved=false;crossed=false;FD.x=FD.y=0;sx=e.clientX-P.x;sy=e.clientY-P.y;ox=e.clientX;oy=e.clientY;hist=[[e.clientX,e.clientY,e.timeStamp]];
  const r=gS.cards.getBoundingClientRect();inCard=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
});
addEventListener('pointermove',e=>{
  if(!down)return;const s=gS,P=tgt==='c'?s.C:s.Wn;P.x=e.clientX-sx;P.y=e.clientY-sy;FD.x=e.clientX-ox;FD.y=e.clientY-oy;
  if(Math.hypot(FD.x,FD.y)>8)moved=true;
  hist.push([e.clientX,e.clientY,e.timeStamp]);if(hist.length>8)hist.shift();
  if(tgt==='c'&&Math.abs(FD.x)>Math.abs(FD.y)&&Math.abs(FD.x)>110&&!crossed){crossed=true;hap(5)}else if(Math.abs(FD.x)<90)crossed=false;
  if(!qd){qd=true;requestAnimationFrame(flush)}
});
/* apply the drag once per frame (Firefox delivers touch events faster than frames) */
function flush(){qd=false;if(!down)return;const s=gS;if(tgt==='c')renderC(s,clamp(vel()[0]*2,-8,8));else renderW(s)}
function end(){
  if(!down)return;down=false;const s=gS,[vx,vy]=vel();
  if(moved){suppress=true;setTimeout(()=>suppress=false,60)}
  if(tgt==='w'){const d=Math.hypot(s.Wn.x,s.Wn.y),sp=Math.hypot(vx,vy);
    if(!moved){spring(s,s.Wn,0,0,()=>renderW(s),'w');if(inCard)tapCover(s);return}
    if(moved&&(d>60||(sp>.45&&d>15)))dismiss(s,vx,vy);else spring(s,s.Wn,vx,vy,()=>renderW(s),'w');return}
  const back=(a,b)=>spring(s,s.C,a,b,()=>renderC(s),'c'),ax=Math.abs(FD.x),ay=Math.abs(FD.y);
  if(!moved){back(0,0);if(inCard)tapCover(s);return}
  if(ax>ay&&(ax>110||(Math.abs(vx)>.55&&ax>30))){fly(Math.abs(vx)>.55?Math.sign(vx):Math.sign(FD.x),vx,vy);return}
  if(ay>=ax&&(ay>80||(Math.abs(vy)>.5&&ay>25))&&performance.now()-enterAt>500)vertical(FD.y<0?-1:1);
  back(vx,vy);
}
addEventListener('pointerup',end);addEventListener('pointercancel',end);
addEventListener('click',e=>{if(suppress){e.preventDefault();e.stopPropagation()}},true);
addEventListener('keydown',e=>{
  if(!cs)return;const o=cs.mode;
  if(e.key==='ArrowRight'&&!o){cs.C.x=cs.C.y=0;fly(1,0,0)}else if(e.key==='ArrowLeft'&&!o){cs.C.x=cs.C.y=0;fly(-1,0,0)}
  else if(e.key==='ArrowUp'&&!o)vertical(-1);else if(e.key==='ArrowDown'&&!o)vertical(1);
  else if(e.key==='Escape'&&o)dismiss(cs,0,0);
  else if(e.key===' '){e.preventDefault();audio.paused?audio.play():audio.pause()}});

/* ---------- data import / export ---------- */
function doExport(){
  let sl=S.seen.slice(-20000),lk=S.liked.slice(-2000),blob;
  do{blob=new Blob([JSON.stringify({app:'tuneder',v:3,n:S.n,w:S.w,c:S.c,dalb:S.dalb.slice(-300),seen:sl,liked:lk})],{type:'application/json'});
     if(blob.size>MAXB){sl=sl.slice(Math.floor(sl.length/2));lk=lk.slice(Math.floor(lk.length/2))}}while(blob.size>MAXB&&sl.length>10);
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tuneder-taste.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);hap(8)}
async function doImport(e,btn){const f=e.target.files[0];e.target.value='';if(!f)return;
  if(f.size>MAXB)return bad(btn);
  try{const j=JSON.parse(await f.text());if(!['tuneder','swipe-sounds'].includes(j.app)||typeof j.w!=='object')throw 0;
    S.w={};for(const k in j.w)if(/^[agdlf]:/.test(k)&&typeof j.w[k]==='number')S.w[k]=clamp(j.w[k],-6,6);
    S.c={};for(const k in(j.c||{}))if(/^[agdlf]:/.test(k)&&Number.isFinite(j.c[k]))S.c[k]=j.c[k];
    S.dalb=Array.isArray(j.dalb)?j.dalb.filter(Number.isFinite).slice(-300):[];
    S.seen=Array.isArray(j.seen)?j.seen.filter(Number.isFinite).slice(-20000):[];S.liked=Array.isArray(j.liked)?j.liked.slice(-2000):[];S.n=+j.n||0;
    migrate();seen=new Set(S.seen);LN=S.liked.slice(-80).map(l=>String(l[2]).toLowerCase()).filter(n=>n.length>3);cool={};pE=[];pX=[];sinceX=9;save();hap(12);refill();
  }catch(err){bad(btn)}}

/* start immediately */
(async()=>{refill();const s=await ensure();ns=null;s.state='cur';cs=s;cur=s.t;enter(s);show(s.t);sync();ensure()})();
})();
